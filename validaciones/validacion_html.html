
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Interfaz validada - versión HTML</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8f0fc;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
        }

        form {
            background: #fff;
            padding: 1.2rem;
            border-radius: 12px;
            width: 320px;
        }

        label {
            display: block;
            margin-top: .6rem;
            font-weight: bold;
            font-size: .9rem;
        }

        input, select {
            width: 100%;
            padding: .5rem;
            margin-top: .2rem;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 1rem;
            padding: .6rem;
            background: #1f6feb;
            color: #fff;
            border: 0;
            border-radius: 8px;
            cursor: pointer;
        }

        input:user-invalid, select:user-invalid {
            border: 2px solid #c5221f;
        }

        input:user-valid, select:user-valid {
            border: 2px solid #1f9d57;
        }
    </style>
</head>

<body>

    <!-- FORMULARIO 1: REGISTRO -->
    <form action="#" method="get">
        <h2>Registro de usuario</h2>

        <label for="nombre">Nombre completo</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            required
            minlength="3"
            maxlength="60"
            pattern="[A-Za-zÁÉÍÓÚÜáéíóúüÑñ ]{3,60}"
            title="Solo letras y espacios, de 3 a 60 caracteres"
        >

        <label for="correo">Correo institucional</label>
        <input
            type="email"
            id="correo"
            name="correo"
            required
            pattern=".+@utng\.edu\.mx"
            title="Usa tu correo institucional (@utng.edu.mx)"
        >

        <label for="clave">Contraseña</label>
        <input
            type="password"
            id="clave"
            name="clave"
            required
            minlength="8"
            maxlength="20"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,20}"
            title="De 8 a 20 caracteres con mayúscula, minúscula y número"
        >

        <label for="clave2">Confirmar contraseña</label>
        <input
            type="password"
            id="clave2"
            name="clave2"
            required
            minlength="8"
            maxlength="20"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,20}"
            title="Debe cumplir los requisitos de contraseña"
        >

        <label for="rol">Rol</label>
        <select id="rol" name="rol" required>
            <option value="">Selecciona un rol</option>
            <option value="Alumno">Alumno</option>
            <option value="Docente">Docente</option>
            <option value="Administrador">Administrador</option>
        </select>

        <button type="submit">Registrarse</button>
    </form>

    <!-- FORMULARIO 2: INICIO DE SESIÓN -->
    <form action="#" method="get">
        <h2>Iniciar sesión</h2>

        <label for="correoLogin">Correo institucional</label>
        <input
            type="email"
            id="correoLogin"
            name="correo"
            required
            title="Escribe un correo válido"
        >

        <label for="claveLogin">Contraseña</label>
        <input
            type="password"
            id="claveLogin"
            name="clave"
            required
            title="Escribe tu contraseña"
        >

        <button type="submit">Iniciar sesión</button>
    </form>

</body>
</html>
