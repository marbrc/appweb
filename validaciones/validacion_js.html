<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interfaz validada - versión JavaScript</title>
  <style>
    /* estilo sencillo solo para que se vea tipo  ordenado y los estilos bonitos van en estilos.css */
    body { font-family: Arial, sans-serif; background: #e8f0fc; display: flex; flex-wrap: wrap; justify-content: center; gap: 1rem; padding: 1rem; }
    form { background: #fff; padding: 1.2rem; border-radius: 12px; width: 320px; }
    label { display: block; margin-top: .6rem; font-weight: bold; font-size: .9rem; }
    input, select { width: 100%; padding: .5rem; margin-top: .2rem; box-sizing: border-box; }
    button { width: 100%; margin-top: 1rem; padding: .6rem; background: #1f6feb; color: #fff; border: 0; border-radius: 8px; }
    /* clases que pone el JavaScript: mal = rojo, bien = verde */
    .mal { border: 2px solid #c5221f; }
    .bien { border: 2px solid #1f9d57; }
    .error { display: block; min-height: 1em; color: #c5221f; font-size: .8rem; }
    .ok { color: #1f9d57; font-weight: bold; }
  </style>
</head>
<body>

  <!-- novalidate = el navegador no valida sol lo valida mi JavaScript de abajo -->
  <!-- Cada campo va en un div "campo" y tiene un <small class="error"> donde se escribe el mensaje de erro -->
  <form id="formRegistro" novalidate>
    <h2>Registro de usuario</h2>
    <div class="campo"><label>Nombre completo <input type="text" name="nombre"></label><small class="error"></small></div>
    <div class="campo"><label>Correo institucional <input type="email" name="correo"></label><small class="error"></small></div>
    <div class="campo"><label>Contraseña <input type="password" name="clave"></label><small class="error"></small></div>
    <div class="campo"><label>Confirmar contraseña <input type="password" name="clave2"></label><small class="error"></small></div>
    <div class="campo">
      <label>Rol
        <select name="rol">
          <option value="">Selecciona un rol</option>
          <option>Alumno</option>
          <option>Docente</option>
          <option>Administrador</option>
        </select>
      </label>
      <small class="error"></small>
    </div>
    <button>Registrarse</button>
    <p class="ok" hidden>Registro correcto</p>
  </form>

  <form id="formLogin" novalidate>
    <h2>Iniciar sesión</h2>
    <div class="campo"><label>Correo institucional <input type="email" name="correo"></label><small class="error"></small></div>
    <div class="campo"><label>Contraseña <input type="password" name="clave"></label><small class="error"></small></div>
    <button>Iniciar sesión</button>
    <p class="ok" hidden>Inicio de sesión correcto</p>
  </form>

<script>
  // ----------  REGLAS ----------
  // cada regla recibe lo que escribió la persona y el formulario 
  // si esta bien regresa true y si está mal regresa el mensaje de error q se va a mostrar
  // si el campo esta vacío ni entra aqui antes lo detiene la función revisar
  const reglasRegistro = {
    nombre: v => /^[A-Za-zÁÉÍÓÚáéíóúÑñ ]{3,60}$/.test(v) || "Solo letras y espacios, de 3 a 60 caracteres",
    correo: v => /^[^@\s]+@utng\.edu\.mx$/.test(v) || "Usa tu correo institucional (@utng.edu.mx)",
    clave: v => /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,20}$/.test(v) || "De 8 a 20 caracteres con mayúscula, minúscula y número",
    clave2: (v, f) => v === f.clave.value || "Las contraseñas no son iguales" // esto es lo que HTML solo no puede hacer
  };
  const reglasLogin = {
    correo: v => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v) || "Escribe un correo válido"
  };

  // ----------REVISARUN CAMPO ----------
  // revisa un campo escribe el mensaje debajo y lo pinta de rojo o verde
  // y regresa true si esta bien o false si esta mal
  function revisar(campo, reglas) {
    const valor = campo.type === "password" ? campo.value : campo.value.trim(); // a las contraseñas no les quia espacios
    let mensaje = "";                                                           // vacio = sin error
    if (valor === "") {
      mensaje = "Este campo es obligatorio";
    } else if (reglas[campo.name]) {
      const resultado = reglas[campo.name](valor, campo.form);
      if (resultado !== true) mensaje = resultado;                              // si no regresó true es el mensaje de error
    }
    campo.closest(".campo").querySelector(".error").textContent = mensaje;      // pongo el mensaje debajo del campo
    campo.classList.toggle("mal", mensaje !== "");                              // rojo si hay error
    campo.classList.toggle("bien", mensaje === "");                             // verde si no hay
    return mensaje === "";
  }

  // ---------- ACTIVAR UN FORMULARIO ----------
  function activar(form, reglas) {
    const campos = [...form.querySelectorAll("input, select")]; // todos los campos del formulario
    const ok = form.querySelector(".ok");                       // el mensaje de "correcto

    campos.forEach(campo => {
      // blur = cuando sale del campo lo revissa
      campo.addEventListener("blur", () => revisar(campo, reglas));
      // input = mientras escriba si estaba mal lo reviso otra vez para que el error se quite en cuantose modifca
      campo.addEventListener("input", () => {
        ok.hidden = true;
        if (campo.classList.contains("mal")) revisar(campo, reglas);
      });
    });

    // submit = cuando presiono el botón
    form.addEventListener("submit", e => {
      e.preventDefault();                                     // no deja que se envíe solo
      const resultados = campos.map(c => revisar(c, reglas)); // revisa tds los campos y cada uno da true o false
      ok.hidden = !resultados.every(r => r);                  // el mensaje de correcto solo se ve si todos están bien
    });
  }

  // ---------- ACTIVAR DOS FORMULARIOS ----------
  activar(document.querySelector("#formRegistro"), reglasRegistro);
  activar(document.querySelector("#formLogin"), reglasLogin);
</script>

</body>
</html>
