<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuesta Docente UTNG</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<!-- el tema se pone antes de que cargue la pagina para que no parpadee en blanco -->
<script>document.documentElement.dataset.tema = localStorage.getItem("tema") || "claro";</script>
<link rel="stylesheet" href="/static/css/estilos.css">
<link rel="stylesheet" href="/static/css/marco.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<!-- EL MARCO: la barra de arriba y el menu NO cambian, solo cambia lo que hay dentro de #contenido -->
<div id="marco" class="marco">

  <!-- barra de arriba: los tres puntitos, el logo, donde estas y tu cuenta -->
  <header class="superior">
    <button id="btn-menu" class="btn-menu" type="button" title="Ocultar menú" aria-label="Ocultar o mostrar el menú"><i data-icono="puntos"></i></button>
    <a class="marca" href="#admin/inicio">
      <img src="/static/img/logo.svg" alt="" width="34" height="34">
      <span><b>Encuesta Docente</b><small>UTNG</small></span>
    </a>
    <!-- migas: Administración > Grupos, el nombre de la pantalla lo pone marco.js -->
    <p class="migas"><span>Administración</span><i data-icono="derecha"></i><b id="titulo">Inicio</b></p>

    <div class="cuenta-caja">
      <button id="btn-cuenta" class="btn-cuenta" type="button" aria-haspopup="true">
        <span class="avatar-mini" id="cuenta-foto"></span>
        <span class="cuenta-txt"><b id="cuenta-nombre"></b><small id="cuenta-rol"></small></span>
        <i data-icono="abajo"></i>
      </button>
      <div id="menu-cuenta" class="menu-cuenta" hidden>
        <div class="menu-cuenta-cab">
          <span class="avatar-mini grande" id="mc-foto"></span>
          <div><b id="mc-nombre"></b><small id="mc-correo"></small></div>
        </div>
        <button type="button" data-ruta="comun/cuenta"><i data-icono="usuario"></i>Mi cuenta</button>
        <button type="button" data-ruta="comun/config"><i data-icono="ajustes"></i>Configuración</button>
        <hr>
        <button type="button" data-salir class="salir"><i data-icono="salir"></i>Cerrar sesión</button>
      </div>
    </div>
  </header>

  <div class="cuerpo">
    <!-- el menu de la izquierda, las opciones las pone marco.js leyendo menus.js -->
    <nav id="lateral" class="lateral" aria-label="Menú principal">
      <div id="menu-op" class="ops"></div>
    </nav>
    <!-- en el celular el menu sale encima y esta sombra lo cierra al tocarla -->
    <div id="velo" class="velo"></div>

    <!-- aqui adentro el router mete cada pantalla -->
    <main id="contenido" class="contenedor"></main>
  </div>
</div>

<!-- la pantallita de cerrando sesión -->
<div id="cerrando" class="cerrando" hidden>
  <div class="cerrando-caja">
    <img src="/static/img/logo.svg" alt="" width="56" height="56">
    <div class="spinner"></div>
    <p>Cerrando sesión…</p>
  </div>
</div>

<script type="module" src="/static/js/nucleo/marco.js"></script>
</body>
</html>
