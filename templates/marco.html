<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administrador</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
    <style>
        .marco { display: flex; flex-direction: column; height: 100vh; background: var(--bg); color: var(--tx); }
        .barra-app { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: var(--hd); color: #fff; }
        .cuerpo { display: flex; flex: 1; overflow: hidden; padding: 0; }

        .opciones { width: 260px; background: var(--card); border-right: 1px solid var(--bd); display: flex; flex-direction: column; padding: 1rem 0; overflow-y: auto; flex-shrink: 0; }
        .opciones .op { display: flex; align-items: center; gap: 15px; width: 100%; padding: 12px 20px; background: none; border: none; text-align: left; cursor: pointer; font-size: 15px; color: var(--tx); transition: background .2s; }
        .opciones .op:hover { background: var(--bg); }
        .opciones .op.activa { background: var(--bg); color: var(--ac); font-weight: bold; border-right: 4px solid var(--pri); }

        .area { flex: 1; padding: 2rem; overflow-y: auto; min-width: 0; }
        .cabecera h1 { margin: 0; color: var(--ac); }
        .cabecera p { margin: 5px 0 0; color: var(--mut); }
    </style>
</head>
<body>

<div id="marco" class="marco">
    <header class="barra-app">
        <b>Encuesta Docente UTNG</b>
        <button id="salir" style="background:#d32f2f;color:white;border:none;padding:8px 15px;border-radius:4px;cursor:pointer;">Cerrar sesión</button>
    </header>

    <main class="cuerpo">
        <nav id="menu-op" class="opciones"></nav>

        <div class="area">
            <header class="cabecera">
                <h1 id="titulo">Cargando...</h1>
                <p id="desc"></p>
            </header>
            <div id="contenido" class="contenido"></div>
        </div>
    </main>
</div>

<script type="module" src="/static/js/app.js"></script>
<script>
    document.getElementById("salir").addEventListener("click", () => {
        localStorage.removeItem("sesion");
        window.location.href = "/";
    });
</script>
</body>
</html>
