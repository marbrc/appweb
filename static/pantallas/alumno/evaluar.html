<!-- /static/pantallas/alumno/evaluar.html -->
<div class="evaluar-alumno">

  <!-- los datos del grupo salen del código con el que entró el alumno, no se eligen -->
  <dl class="grupo-datos" id="datos-grupo">
    <dt>Grupo</dt><dd id="g-grupo"></dd>
    <dt>Carrera</dt><dd id="g-carrera"></dd>
    <dt>Cuatrimestre</dt><dd id="g-cuatri"></dd>
  </dl>

  <div class="filtros">
    <select id="f-clase" aria-label="Materia y Profesor"></select>
  </div>

  <p id="aviso" class="sub">Elige la materia y el profesor que vas a evaluar.</p>
  <p id="clase-info" class="sub" hidden></p>

  <p id="cuenta-eval">0 de 0 respondidas</p>
  <div class="prog"><i style="width:0%"></i></div>

  <form id="form-eval">
    <fieldset id="preguntas" disabled></fieldset>

    <label class="comentario">
      Comentario (opcional)
      <textarea name="comentario" maxlength="300" rows="3"
                placeholder="Cuéntale a tu profesor qué te gusta y qué podría mejorar..."></textarea>
    </label>

    <div class="acciones">
      <button class="btn" type="submit">Enviar evaluación</button>
    </div>
  </form>

  <div id="gracias" hidden>
    <h2>¡Gracias por tu evaluación!</h2>
    <p class="sub">Tus respuestas se guardaron de forma anónima.</p>
  </div>

</div>
