<!-- /static/pantallas/admin/preguntas.html -->
<div class="pg admin-catalogo">
  <!-- el letrero de arriba, p-total lo llena preguntas.js con cuantas preguntas hay -->
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="pregunta"></i></span>
      <div>
        <h2>Preguntas de la encuesta</h2>
        <p class="sub">Lo que van a responder los alumnos, del 5 al 10 <span class="total" id="p-total"></span></p>
      </div>
    </div>
    <button class="btn" id="p-nuevo" type="button"><i data-icono="mas"></i>Nueva pregunta</button>
  </div>

  <form id="p-form" class="form-cat" hidden>
    <h3 class="form-tit">Texto de la pregunta</h3>
    <!-- Campo oculto para el número, el sistema lo asignará solo -->
    <input type="hidden" name="num">
    
    <label>Texto de la pregunta
      <textarea name="texto" rows="3" required 
                minlength="10" 
                maxlength="250"
                placeholder="Ej. El profesor expone los contenidos de manera clara..."
                oninput="this.value = this.value.charAt(0).toUpperCase() + this.value.slice(1)"></textarea>
      <small style="font-weight: normal; opacity: 0.7;">Mínimo 10 caracteres, máximo 250. Inicia con mayúscula.</small>
    </label>
    
    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <button class="btn sec" type="button" id="p-cancelar">Cancelar</button>
    </div>
  </form>

  <ul id="p-lista" class="lista-preguntas"></ul>
</div>
