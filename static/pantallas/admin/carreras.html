<!-- /static/pantallas/admin/carreras.html -->
<div class="pg admin-catalogo">
  <!-- el letrero de arriba, c-total lo llena carreras.js con cuantas carreras hay -->
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="carreras"></i></span>
      <div>
        <h2>Carreras</h2>
        <p class="sub">Registra y administra las carreras de la universidad <span class="total" id="c-total"></span></p>
      </div>
    </div>
    <button class="btn" id="c-nuevo" type="button"><i data-icono="mas"></i>Nueva carrera</button>
  </div>

  <form id="c-form" class="form-cat" hidden>
    <h3 class="form-tit" id="c-titulo">Datos de la carrera</h3>
    <label>Nombre de la carrera
      <input
        name="nombre"
        required
        minlength="10"
        maxlength="200"
        placeholder="Ej. Desarrollo de software"
        pattern="^[A-ZÁÉÍÓÚÑ][a-záéíóúñü\s]*$"
        title="Solo la primera letra debe ser mayúscula, el resto minúsculas. Máximo 200 caracteres."
        autocomplete="off">
    </label>

    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <button class="btn sec" type="button" id="c-cancelar">Cancelar</button>
    </div>
  </form>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>#</th>
          <th>Carrera</th>
          <th>Grupos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="c-tabla"></tbody>
    </table>
  </div>
</div>

<script>
  // Bloquea caracteres no válidos, fuerza la primera letra a mayúscula y el resto a minúscula
  (function () {
    const input = document.querySelector('#c-form input[name="nombre"]');
    if (!input) return;

    input.addEventListener("input", function () {
      // 1. Quita todo lo que no sea letra (con acentos/ñ) ni espacio
      let valor = this.value.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ\s]/g, "");
      
      // 2. Forzar todo a minúsculas primero
      valor = valor.toLowerCase();
      
      // 3. Si hay texto, poner la primera letra en mayúscula
      if (valor.length > 0) {
        valor = valor.charAt(0).toUpperCase() + valor.slice(1);
      }
      
      // 4. Límite de 200 caracteres
      if (valor.length > 200) {
        valor = valor.slice(0, 200);
      }
   
      
      
      // 5. Asignar el valor limpio de vuelta al input
      this.value = valor;
    });
  })();
</script>
