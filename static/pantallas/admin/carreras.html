<div class="pg admin-catalogo" id="v-catalogo">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="carreras"></i></span>
      <div>
        <h2>Carreras</h2>
        <p class="sub">Registra y administra las carreras de la universidad <span class="total" id="total-carreras"></span></p>
      </div>
    </div>
    <button class="btn" id="btn-nueva-carrera" type="button"><i data-icono="mas"></i>Nueva carrera</button>
  </div>

  <p id="mensaje-carreras" hidden></p>

  <div id="formulario-carrera" hidden>
    <form id="form-carrera" class="form-cat">
      <h3 class="form-tit" id="titulo-formulario">Registrar carrera</h3>
      <input type="hidden" id="indice-carrera">

      <label>Nombre de la carrera
        <input type="text" id="nombre-carrera" placeholder="Ej. Desarrollo de Software" required maxlength="100">
      </label>

      <div class="acciones">
        <button class="btn" type="submit">Guardar</button>
        <button class="btn sec" type="button" id="cancelar-carrera">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>#</th>
          <th>Carrera</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tabla-carreras"></tbody>
    </table>
  </div>
</div>
