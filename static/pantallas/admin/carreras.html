
<div id="v-catalogo">
  <div class="barra-acc">
    <div>
      <h2>Carreras registradas</h2>
      <p class="sub">Administra las carreras de la universidad.</p>
    </div>
    <button class="primario" id="btn-nueva-carrera">
      + Nueva carrera
    </button>
  </div>

  <p id="mensaje-carreras" hidden></p>

  <section class="tarjeta" id="formulario-carrera" hidden>
    <h3 id="titulo-formulario">Registrar carrera</h3>

    <form id="form-carrera" class="form-cat">
      <input type="hidden" id="indice-carrera">

      <label>
        Nombre de la carrera
        <input
          type="text"
          id="nombre-carrera"
          placeholder="Ej. Desarrollo de Software"
          required
          maxlength="100"
        >
      </label>

      <div class="acciones">
        <button type="submit" class="primario">Guardar</button>
        <button type="button" class="mini" id="cancelar-carrera">
          Cancelar
        </button>
      </div>
    </form>
  </section>

  <section class="tarjeta">
    <div class="barra-acc">
      <h3>Listado de carreras</h3>
      <span class="sub" id="total-carreras">0 carreras</span>
    </div>

    <div class="tabla-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Nombre de la carrera</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla-carreras"></tbody>
      </table>
    </div>
  </section>
</div>
