<!-- /static/pantallas/admin/grupos.html -->
<div class="pg admin-catalogo">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="grupos"></i></span>
      <div>
        <h2>Grupos</h2>
        <p class="sub">Registra y organiza los grupos de cada carrera <span class="total" id="g-total"></span></p>
      </div>
    </div>
    <button class="btn" id="g-nuevo" type="button"><i data-icono="mas"></i>Nuevo grupo</button>
  </div>

  <form id="g-form" class="form-cat" hidden>
    <h3 class="form-tit">Datos del grupo</h3>

    <label>Clave del Grupo
      <input name="clave" required placeholder="Ej. DSW123" pattern="[A-Z]{3,4}[0-9]{3}"
             title="3 o 4 letras mayúsculas seguidas de 3 números (Ej. DSW123, MEC1234)"
             oninput="this.value = this.value.toUpperCase()">
    </label>

    <label>Carrera
      <select name="carrera" required>
        <option value="">Selecciona</option>
      </select>
    </label>

    <label>Cuatrimestre
      <input type="number" name="cuatrimestre" min="1" max="12" placeholder="Ej. 1" required>
    </label>

    <label>Alumnos en el grupo
      <input type="number" name="alumnos" min="1" max="100" step="1" placeholder="Ej. 30" required>
    </label>

    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <button class="btn sec" type="button" id="g-cancelar">Cancelar</button>
    </div>
  </form>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Clave</th>
          <th>Carrera</th>
          <th>Cuatrimestre</th>
          <th>Alumnos</th>
          <th>Respondieron</th>
          <th>Participación</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="g-tabla"></tbody>
    </table>
  </div>
</div>
