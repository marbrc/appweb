<!-- /static/pantallas/admin/grupos.html -->
<div class="pg admin-catalogo">
  <!-- el letrero de arriba, g-total lo llena grupos.js con cuantos grupos hay -->
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="grupos"></i></span>
      <div>
        <h2>Grupos</h2>
        <p class="sub">Registra y organiza los grupos de cada carrera <span class="total" id="g-total"></span></p>
      </div>
    </div>
    <button class="btn" id="g-nuevo" type="button"><i data-icono="mas"></i>Nuevo grupo</button>
  </div>

  <form id="g-form" class="form-cat" hidden>
    <h3 class="form-tit">Datos del grupo</h3>
    <label>Clave
      <input name="clave" required 
             placeholder="Ej. DSW123" 
             pattern="[A-Z]{4}[0-9]{3}" 
             title="La clave debe tener 4 letras mayúsculas seguidas de 3 números (Ej. DSW123)"
             oninput="this.value = this.value.toUpperCase()">
    </label>
    
    <label>Carrera
      <select name="carrera" required>
        <option value="">Selecciona</option>
        <option>Desarrollo de Software</option>
        <option>Mecatrónica</option>
        <option>Contabilidad</option>
      </select>
    </label>
    
    <label>Cuatrimestre
      <input type="number" name="cuatrimestre" min="1" max="12" required>
    </label>
    
    <label>Docente titular
      <select name="docente" id="g-docente" required>
        <option value="">Cargando docentes...</option>
      </select>
    </label>

    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <button class="btn sec" type="button" id="g-cancelar">Cancelar</button>
    </div>
  </form>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Clave</th>
          <th>Carrera</th>
          <th>Cuatrimestre</th>
          <th>Docente</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="g-tabla"></tbody>
    </table>
  </div>
</div>
