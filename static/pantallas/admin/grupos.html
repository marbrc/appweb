<!-- /static/pantallas/admin/grupos.html -->
<div class="pg admin-catalogo">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="grupos"></i></span>
      <div>
        <h2>Grupos</h2>
        <p class="sub">Cada grupo tiene su carrera y su cuatrimestre; de ahí salen sus asignaturas <span class="total" id="g-total"></span></p>
      </div>
    </div>
    <button class="btn" id="g-nuevo" type="button"><i data-icono="mas"></i>Nuevo grupo</button>
  </div>

  <form id="g-form" class="form-cat" hidden>
    <h3 class="form-tit" id="g-titulo">Datos del grupo</h3>

    <label>Clave del Grupo
      <input name="clave" required placeholder="Ej. GTID241" pattern="[A-Z]{3,4}[0-9]{3}"
             title="3 o 4 letras mayúsculas seguidas de 3 números (Ej. DSW123, MEC1234)"
             oninput="this.value = this.value.toUpperCase()">
    </label>

    <label>Carrera
      <select name="carrera" required>
        <option value="">Selecciona</option>
      </select>
    </label>

    <label>Cuatrimestre
      <input type="number" name="cuatrimestre" min="1" max="11" placeholder="Ej. 4" required>
    </label>

    <label>Alumnos en el grupo
      <input type="number" name="alumnos" min="1" max="100" step="1" placeholder="Ej. 30" required>
      <small class="ayuda">De 1 a 100. Con este número se calcula la participación.</small>
    </label>

    <div class="acciones">
      <button class="btn sec" type="button" id="g-cancelar">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>

  <!-- filtros -->
  <div class="filtros">
    <label class="buscador" aria-label="Buscar"><i data-icono="buscar"></i><input id="g-buscar" type="search" placeholder="Buscar clave del grupo…"></label>
    <select id="g-f-carrera" aria-label="Carrera"><option value="">Todas las carreras</option></select>
    <select id="g-f-cuatri" aria-label="Cuatrimestre"><option value="">Todos los cuatrimestres</option></select>
  </div>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Clave</th>
          <th>Carrera</th>
          <th>Cuatrimestre</th>
          <th>Alumnos</th>
          <th>Clases</th>
          <th>Respondieron</th>
          <th>Participación</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="g-tabla"></tbody>
    </table>
  </div>
</div>
