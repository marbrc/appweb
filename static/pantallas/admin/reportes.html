<!-- /static/pantallas/admin/reportes.html -->
<div class="pg admin-reportes" id="pantalla-reportes">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="grafica"></i></span>
      <div>
        <h2>Reportes de Evaluación</h2>
        <p class="sub">Filtra los resultados por carrera, cuatrimestre, grupo, profesor y materia.</p>
      </div>
    </div>
  </div>

  <!-- Filtros en cascada -->
  <div class="filtros">
    <select id="r-carrera"><option value="">Todas las carreras</option></select>
    <select id="r-cuatri" disabled><option value="">Todos los cuatrimestres</option></select>
    <select id="r-grupo" disabled><option value="">Todos los grupos</option></select>
    <select id="r-prof" disabled><option value="">Todos los profesores</option></select>
    <select id="r-mat" disabled><option value="">Todas las materias</option></select>
  </div>

  <p id="r-info" class="sub">0 evaluación(es) encontradas</p>

  <div class="panel-c">
    <h3>Promedio por pregunta</h3>
    <div id="r-barras"></div>
  </div>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Fecha</th><th>Carrera</th><th>Cuatrimestre</th><th>Grupo</th><th>Profesor</th><th>Materia</th><th>Promedio</th><th>Comentario</th>
        </tr>
      </thead>
      <tbody id="r-tabla"></tbody>
    </table>
  </div>
</div>
