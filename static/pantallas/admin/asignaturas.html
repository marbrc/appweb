<!-- /static/pantallas/admin/asignaturas.html -->
<div class="pg admin-catalogo">
  <!-- el letrero de arriba, s-total lo llena asignaturas.js con cuantas asignaturas hay -->
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="libro"></i></span>
      <div>
        <h2>Asignaturas</h2>
        <p class="sub">Las materias que se evalúan en cada carrera y cuatrimestre <span class="total" id="s-total"></span></p>
      </div>
    </div>
    <button class="btn" id="s-nuevo" type="button">
      <i data-icono="mas"></i>Nueva asignatura
    </button>
  </div>

  <form id="s-form" class="form-cat" hidden>
    <h3 class="form-tit">Datos de la asignatura</h3>
    <label>
      Nombre de la asignatura
      <input
        type="text"
        name="nombre"
        required
        maxlength="60"
        placeholder="Ej. Bases de datos, Inglés IV"
        pattern="^[A-ZÁÉÍÓÚÑ][a-záéíóúñü\s]*(?:\s+[IVXLCDM]+)?$"
        title="Solo letras. La primera debe ser mayúscula. Puede terminar con número romano en mayúscula (ej. Inglés IV)."
      >
    </label>

    <label>
      Carrera
      <select name="carrera" required>
        <option value="">Selecciona una carrera</option>
      </select>
    </label>

    <label>
      Cuatrimestre
      <select name="cuatrimestre" required>
        <option value="">Selecciona un cuatrimestre</option>
        <option value="1">1° cuatrimestre</option>
        <option value="2">2° cuatrimestre</option>
        <option value="3">3° cuatrimestre</option>
        <option value="4">4° cuatrimestre</option>
        <option value="5">5° cuatrimestre</option>
        <option value="6">6° cuatrimestre</option>
        <option value="7">7° cuatrimestre</option>
        <option value="8">8° cuatrimestre</option>
        <option value="9">9° cuatrimestre</option>
        <option value="10">10° cuatrimestre</option>
        <option value="11">11° cuatrimestre</option>
        <option value="12">12° cuatrimestre</option>
      </select>
    </label>

    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <button class="btn sec" type="button" id="s-cancelar">
        Cancelar
      </button>
    </div>
  </form>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Carrera</th>
          <th>Cuatrimestre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="s-tabla"></tbody>
    </table>
  </div>
</div>
