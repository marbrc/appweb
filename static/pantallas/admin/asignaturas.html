<!-- /static/pantallas/admin/asignaturas.html -->
<div class="pg admin-catalogo">
  <!-- el letrero de arriba, s-total lo llena asignaturas.js con cuantas asignaturas hay -->
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="libro"></i></span>
      <div>
        <h2>Asignaturas</h2>
        <p class="sub">El catálogo de materias: solo el nombre. La carrera y el cuatrimestre los pone el grupo <span class="total" id="s-total"></span></p>
      </div>
    </div>
    <button class="btn" id="s-nuevo" type="button"><i data-icono="mas"></i>Nueva asignatura</button>
  </div>

  <form id="s-form" class="form-cat" hidden>
    <h3 class="form-tit" id="s-titulo">Datos de la asignatura</h3>
    <label>Nombre de la asignatura
      <input type="text" name="nombre" required maxlength="60" placeholder="Ej. Bases de Datos, Inglés IV"
        pattern="[A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 ]*"
        title="Debe empezar con mayúscula; puede llevar letras, números y espacios. Ej. Inglés IV, Animación 3D">
    </label>

    <div class="acciones">
      <button class="btn sec" type="button" id="s-cancelar">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>


  <!-- filtros: buscar por nombre y ver las materias de una carrera y cuatrimestre (sale del plan de estudios) -->
  <div class="filtros">
    <label class="buscador" aria-label="Buscar"><i data-icono="buscar"></i><input id="s-buscar" type="search" placeholder="Buscar asignatura…"></label>
    <select id="s-carrera" aria-label="Carrera"><option value="">Todas las carreras</option></select>
    <select id="s-cuatri" aria-label="Cuatrimestre"><option value="">Todos los cuatrimestres</option></select>
    <select id="s-uso" aria-label="Uso">
      <option value="">Todas</option>
      <option value="sin-plan">Sin carrera/cuatrimestre aún</option>
      <option value="en-carga">Con docente asignado</option>
      <option value="libres">Sin docente asignado</option>
    </select>
  </div>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Asignatura</th>
          <th>Se cursa en</th>
          <th>Grupos con docente</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="s-tabla"></tbody>
    </table>
  </div>
</div>
