<!-- /static/pantallas/admin/asignaturas.html -->
<div class="pg admin-catalogo">
  <!-- el letrero de arriba, s-total lo llena asignaturas.js con cuantas asignaturas hay -->
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="libro"></i></span>
      <div>
        <h2>Asignaturas</h2>
        <p class="sub">Catálogo de materias; el plan dice en qué carrera y cuatrimestre se cursan <span class="total" id="s-total"></span></p>
      </div>
    </div>
    <div class="cab-acc">
      <button class="btn sec" id="s-papelera" type="button"><i data-icono="basura"></i>Ver eliminados</button>
      <button class="btn" id="s-nuevo" type="button"><i data-icono="mas"></i>Nueva asignatura</button>
    </div>
  </div>

  <!-- Antes el formulario pedía carrera y cuatrimestre y la misma materia se duplicaba por grupo.
       Ahora la asignatura es solo el nombre (único). El plan de estudios se arma desde Carga Académica:
       ahí se elige el grupo y salen las materias de su carrera y cuatrimestre. -->
  <form id="s-form" class="form-cat" hidden>
    <h3 class="form-tit" id="s-titulo">Datos de la asignatura</h3>
    <label>Nombre de la asignatura
      <input type="text" name="nombre" required maxlength="60" placeholder="Ej. Bases de Datos, Inglés IV, Animación 3D"
        pattern="[A-ZÁÉÍÓÚÜÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 .,\-]*"
        title="Debe empezar con mayúscula. Puede llevar letras, números, espacios y signos como Animación 3D">
    </label>

    <div class="acciones">
      <button class="btn sec" type="button" id="s-cancelar">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>


  <div class="filtros-uno">
    <label class="buscador" aria-label="Buscar asignatura"><i data-icono="buscar"></i>
      <input id="s-buscar" type="search" placeholder="Buscar asignatura…" autocomplete="off">
    </label>
  </div>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Asignatura</th>
          <th>Se cursa en</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="s-tabla"></tbody>
    </table>
  </div>
</div>
