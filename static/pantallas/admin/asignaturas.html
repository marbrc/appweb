<!-- /static/pantallas/admin/asignaturas.html -->
<div class="pg admin-catalogo">
  <!-- el letrero de arriba, s-total lo llena asignaturas.js con cuantas asignaturas hay -->
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="libro"></i></span>
      <div>
        <h2>Asignaturas</h2>
        <p class="sub">Las materias de cada carrera y cuatrimestre <span class="total" id="s-total"></span></p>
      </div>
    </div>
    <button class="btn" id="s-nuevo" type="button"><i data-icono="mas"></i>Nueva asignatura</button>
  </div>

  <!-- OJO antes el formulario solo pedia el nombre y en la BD cada asignatura va ligada a los grupos
       de una carrera y cuatrimestre, por eso al guardar se borraban o no se guardaban. Ahora pide los tres -->
  <form id="s-form" class="form-cat" hidden>
    <h3 class="form-tit" id="s-titulo">Datos de la asignatura</h3>
    <label>Nombre de la asignatura
      <input type="text" name="nombre" required maxlength="60" placeholder="Ej. Bases de Datos, Inglés IV"
        pattern="[A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÜÑáéíóúüñ0-9 ,.()-]*"
        title="Debe empezar con mayúscula. Ej. Inglés IV">
    </label>
    <label>Carrera
      <select name="carrera" required><option value="">Selecciona una carrera</option></select>
    </label>
    <label>Cuatrimestre
      <select name="cuatrimestre" required><option value="">Selecciona</option></select>
      <small class="ayuda">Se agrega a todos los grupos de esa carrera y cuatrimestre.</small>
    </label>

    <div class="acciones">
      <button class="btn sec" type="button" id="s-cancelar">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>

  <div class="filtros">
    <select id="s-f-carrera" aria-label="Filtrar por carrera"><option value="">Todas las carreras</option></select>
    <select id="s-f-cuatri" aria-label="Filtrar por cuatrimestre"><option value="">Todos los cuatrimestres</option></select>
  </div>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Asignatura</th>
          <th>Carrera</th>
          <th>Cuatrimestre</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="s-tabla"></tbody>
    </table>
  </div>
</div>
