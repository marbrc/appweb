<!-- /static/pantallas/admin/asignaturas.html -->
<div class="admin-catalogo">
  <div class="cab">
    <h2>Asignaturas</h2>
    <button class="btn" id="s-nuevo" type="button">+ Nueva asignatura</button>
  </div>

  <form id="s-form" class="form-cat" hidden>
    <label>Nombre
      <input name="nombre" required placeholder="Ej. Bases de datos">
    </label>
    <label>Carrera
      <select name="carrera" required>
        <option value="">Selecciona</option>
        <option>Desarrollo de Software</option>
        <option>Entornos virtuales</option>
        <option>Mecatrónica</option>
      </select>
    </label>
    <label>Cuatrimestre
      <input type="number" name="cuatrimestre" min="1" max="12" required>
    </label>
    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <button class="btn sec" type="button" id="s-cancelar">Cancelar</button>
    </div>
  </form>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead><tr><th>Nombre</th><th>Carrera</th><th>Cuatrimestre</th><th></th></tr></thead>
      <tbody id="s-tabla"></tbody>
    </table>
  </div>
</div>
