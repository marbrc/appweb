<!-- /static/pantallas/admin/docentes.html -->
<div class="pg admin-catalogo">
  <!-- el letrero de arriba, d-total lo llena docentes.js con cuantos docentes hay -->
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="docentes"></i></span>
      <div>
        <h2>Docentes</h2>
        <p class="sub">Administra a los profesores que los alumnos pueden evaluar <span class="total" id="d-total"></span></p>
      </div>
    </div>
    <button class="btn" id="d-nuevo" type="button"><i data-icono="mas"></i>Nuevo docente</button>
  </div>

  <form id="d-form" class="form-cat" hidden>
    <h3 class="form-tit">Datos del docente</h3>
    <label>Nombre(s) 
      <input name="nombres" required placeholder="Ej. Apolinar" 
             pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,50}$"
             title="El nombre debe tener entre 3 y 50 letras, solo letras y espacios."
             oninput="this.value = this.value.replace(/\b\w/g, l => l.toUpperCase())">
    </label>

    <label>Apellido Paterno 
      <input name="paterno" required placeholder="Ej. Trejo" 
             pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,20}$"
             title="El apellido paterno debe tener entre 3y 20 letras, solo letras y espacios."
             oninput="this.value = this.value.replace(/\b\w/g, l => l.toUpperCase())">
    </label>

    <label>Apellido Materno
      <input name="materno" placeholder="Ej. Cuevas" 
             pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]*$"
             title="El apellido materno solo puede contener letras y espacios."
             oninput="this.value = this.value.replace(/\b\w/g, l => l.toUpperCase())">
    </label>

    <label>Correo
      <input type="email" name="correo" required placeholder="Ej. erika@utng.edu.mx">
    </label>
    
    <div class="acciones">
      <button class="btn" type="submit">Guardar</button>
      <button class="btn sec" type="button" id="d-cancelar">Cancelar</button>
    </div>
  </form>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead><tr><th>Nombre Completo</th><th>Correo</th><th></th></tr></thead>
      <tbody id="d-tabla"></tbody>
    </table>
  </div>
</div>
