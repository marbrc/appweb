<div class="pg admin-catalogo">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="docentes"></i></span>
      <div>
        <h2>Docentes</h2>
        <p class="sub">Administra a los profesores y asígnales sus materias <span class="total" id="d-total"></span></p>
      </div>
    </div>
    <div class="cab-acc">
      <button class="btn sec" id="d-papelera" type="button"><i data-icono="basura"></i>Ver eliminados</button>
      <button class="btn" id="d-nuevo" type="button"><i data-icono="mas"></i>Nuevo docente</button>
    </div>
  </div>

  <form id="d-form" class="form-cat" hidden>
    <h3 class="form-tit" id="d-titulo">Datos del docente</h3>

    <label>Nombre(s)
      <input name="nombres" required placeholder="Ej. Apolinar"
        pattern="[A-ZÁÉÍÓÚÑ][a-záéíóúüñ]*\.?(\s[A-ZÁÉÍÓÚÑ][a-záéíóúüñ]*\.?)*"
        title="Cada nombre debe empezar con mayúscula. Ej. Juan Carlos o J. Refugio">
    </label>
    <label>Apellido Paterno
      <input name="paterno" required placeholder="Ej. Trejo"
        pattern="[A-ZÁÉÍÓÚÑ][a-záéíóúüñ]*\.?(\s[A-ZÁÉÍÓÚÑ][a-záéíóúüñ]*\.?)*"
        title="Debe empezar con mayúscula. Ej. Trejo">
    </label>
    <label>Apellido Materno
      <input name="materno" placeholder="Ej. Cuevas"
        pattern="([A-ZÁÉÍÓÚÑ][a-záéíóúüñ]*\.?(\s[A-ZÁÉÍÓÚÑ][a-záéíóúüñ]*\.?)*)?"
        title="Debe empezar con mayúscula. Ej. Cuevas">
    </label>
    <label><span>Correo <small class="ayuda">(opcional)</small></span>
      <input type="email" name="correo" placeholder="Ej. erika@utng.edu.mx">
    </label>

    <div class="completo" style="border-top:1px solid var(--bd);padding-top:1rem">
      <b>Asignaturas que imparte</b> <small class="ayuda">sirve para sugerirlas primero en Carga Académica</small>
      <div id="d-materias" class="checks"></div>
    </div>

    <div class="acciones">
      <button class="btn sec" type="button" id="d-cancelar">Cancelar</button>
      <button class="btn" type="submit">Guardar</button>
    </div>
  </form>
