<!-- /static/pantallas/admin/clases.html -->
<div class="pg admin-clases">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="maletin"></i></span>
      <div>
        <h2>Carga Académica</h2>
        <p class="sub">Asigna qué docente da qué materia en cada grupo <span class="total" id="cl-total"></span></p>
      </div>
    </div>
    <button class="btn" id="cl-nuevo" type="button"><i data-icono="mas"></i>Nueva asignación</button>
  </div>

  <!-- FORMULARIO -->
  <form id="cl-form" class="form-cat" hidden>
    <h3 class="form-tit">Asignar docente a una materia</h3>
    
    <div class="grid-2">
      <!-- PRIMERO EL GRUPO -->
      <label>
        Grupo
        <select name="grupo" id="cl-sel-grupo" required>
          <option value="">Selecciona un grupo...</option>
        </select>
      </label>

      <!-- SEGUNDO EL DOCENTE -->
      <label>
        Docente
        <select name="docente" id="cl-sel-docente" required disabled>
          <option value="">Elige grupo primero...</option>
        </select>
      </label>

      <!-- TERCERO LA ASIGNATURA: salen solitas las que le tocan al grupo según su carrera y cuatrimestre
           (plan de estudios), con ★ las que el docente tiene marcadas -->
      <label>
        Asignatura
        <select name="asignatura" id="cl-sel-asignatura" required disabled>
          <option value="">Elige grupo y docente primero...</option>
        </select>
      </label>
    </div>

    <!-- lo llena clases.js al elegir el grupo: carrera y cuatrimestre salen del grupo, no se escriben -->
    <p class="nota-caja" id="cl-info-grupo" hidden></p>
    <label class="check" id="cl-todas-caja" hidden>
      <input type="checkbox" id="cl-todas"> Mostrar todas las asignaturas del catálogo (no solo las de este cuatrimestre)
    </label>

    <div class="acciones">
      <button class="btn sec" type="button" id="cl-cancelar">Cancelar</button>
      <button class="btn" type="submit">Guardar asignación</button>
    </div>
  </form>

  <!-- FILTROS -->
  <div class="filtros">
    <label class="buscador" aria-label="Buscar"><i data-icono="buscar"></i><input id="cl-buscar" type="search" placeholder="Buscar grupo, docente o materia…"></label>
    <select id="cl-f-carrera" aria-label="Carrera"><option value="">Todas las carreras</option></select>
    <select id="cl-f-cuatri" aria-label="Cuatrimestre"><option value="">Todos los cuatrimestres</option></select>
    <select id="cl-f-grupo" aria-label="Grupo"><option value="">Todos los grupos</option></select>
    <select id="cl-f-docente" aria-label="Docente"><option value="">Todos los docentes</option></select>
  </div>

  <!-- TABLA -->
  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Grupo</th>
          <th>Carrera · Cuatri</th>
          <th>Docente</th>
          <th>Asignatura</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cl-tabla"></tbody>
    </table>
  </div>
</div>
