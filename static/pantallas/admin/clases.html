<!-- /static/pantallas/admin/clases.html -->
<div class="pg admin-clases">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="maletin"></i></span>
      <div>
        <h2>Carga Académica</h2>
        <p class="sub">Asigna qué docente da qué materia en cada grupo <span class="total" id="cl-total"></span></p>
      </div>
    </div>
    <div class="cab-acc">
      <button class="btn sec" id="cl-papelera" type="button"><i data-icono="basura"></i>Ver eliminados</button>
      <button class="btn" id="cl-nuevo" type="button"><i data-icono="mas"></i>Nueva asignación</button>
    </div>
  </div>

  <!-- FORMULARIO -->
  <form id="cl-form" class="form-cat" hidden>
    <h3 class="form-tit">Asignar docente a una materia</h3>
    
    <div class="grid-2">
      <!-- PRIMERO EL GRUPO -->
      <label>
        Grupo
        <select name="grupo" id="cl-sel-grupo" required>
          <option value="">Selecciona un grupo...</option>
        </select>
      </label>

      <!-- SEGUNDO EL DOCENTE -->
      <label>
        Docente
        <select name="docente" id="cl-sel-docente" required disabled>
          <option value="">Elige grupo primero...</option>
        </select>
      </label>

      <!-- LA CARRERA Y EL CUATRIMESTRE SE LLENAN SOLOS AL ELEGIR EL GRUPO -->
      <label>
        Carrera
        <input id="cl-carrera" readonly placeholder="Se llena al elegir el grupo">
      </label>

      <label>
        Cuatrimestre
        <input id="cl-cuatri" readonly placeholder="Se llena al elegir el grupo">
      </label>

      <!-- LAS MATERIAS SALEN DEL PLAN DE ESTUDIOS DE ESA CARRERA Y CUATRIMESTRE -->
      <label>
        Asignatura
        <select name="asignatura" id="cl-sel-asignatura" required disabled>
          <option value="">Elige grupo y docente primero...</option>
        </select>
      </label>
    </div>

    <label class="check-linea">
      <input type="checkbox" id="cl-todas">
      Mostrar todas las materias (también las que no están en el plan de esta carrera y cuatrimestre)
    </label>

    <div class="acciones">
      <button class="btn sec" type="button" id="cl-cancelar">Cancelar</button>
      <button class="btn" type="submit">Guardar asignación</button>
    </div>
  </form>

  <!-- TABLA -->
  <div class="filtros-uno">
    <label class="buscador" aria-label="Buscar asignación"><i data-icono="buscar"></i>
      <input id="cl-buscar" type="search" placeholder="Buscar grupo, materia o docente…" autocomplete="off">
    </label>
  </div>

  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Grupo</th>
          <th>Docente</th>
          <th>Asignatura</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cl-tabla"></tbody>
    </table>
  </div>
</div>
