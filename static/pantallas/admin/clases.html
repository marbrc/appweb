<!-- /static/pantallas/admin/clases.html -->
<div class="pg admin-clases">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="maletin"></i></span>
      <div>
        <h2>Carga Académica</h2>
        <p class="sub">Asigna qué docente da qué materia en cada grupo <span class="total" id="cl-total"></span></p>
      </div>
    </div>
    <button class="btn" id="cl-nuevo" type="button"><i data-icono="mas"></i>Nueva asignación</button>
  </div>

  <!-- FORMULARIO -->
  <form id="cl-form" class="form-cat" hidden>
    <h3 class="form-tit">Asignar docente a una materia</h3>
    
    <div class="grid-2">
      <!-- PRIMERO EL GRUPO -->
      <label>
        Grupo
        <select name="grupo" id="cl-sel-grupo" required>
          <option value="">Selecciona un grupo...</option>
        </select>
      </label>

      <!-- SEGUNDO EL DOCENTE -->
      <label>
        Docente
        <select name="docente" id="cl-sel-docente" required disabled>
          <option value="">Elige grupo primero...</option>
        </select>
      </label>

      <!-- TERCERO LA ASIGNATURA (salen las del grupo, con ★ las que el docente tiene marcadas) -->
      <label>
        Asignatura
        <select name="asignatura" id="cl-sel-asignatura" required disabled>
          <option value="">Elige grupo y docente primero...</option>
        </select>
      </label>
    </div>

    <div class="acciones">
      <button class="btn sec" type="button" id="cl-cancelar">Cancelar</button>
      <button class="btn" type="submit">Guardar asignación</button>
    </div>
  </form>

  <!-- TABLA -->
  <div class="tabla-scroll">
    <table class="tabla">
      <thead>
        <tr>
          <th>Grupo</th>
          <th>Docente</th>
          <th>Asignatura</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="cl-tabla"></tbody>
    </table>
  </div>
</div>
