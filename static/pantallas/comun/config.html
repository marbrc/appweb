<!-- configuracion, por ahora solo el tema. cada tarjeta lleva su vista previa y config.js le pone la palomita a la que esta activaaa -->
<div class="pg">
  <div class="cab">
    <div class="cab-txt">
      <span class="cab-ico"><i data-icono="ajustes"></i></span>
      <div>
        <h2>Configuración</h2>
        <p class="sub">Elige cómo quieres ver la aplicación</p>
      </div>
    </div>
  </div>

  <div class="pg-card">
    <h3>Tema</h3>
    <p class="sub">Se guarda en este navegador.</p>
    <div class="temas-g temas">
      <button class="tema-card" data-t="claro" type="button">
        <div class="vista claro"><i></i><span></span></div>
        <b>Azul claro <i data-icono="check" class="palomita"></i></b>
      </button>
      <button class="tema-card" data-t="oscuro" type="button">
        <div class="vista oscuro"><i></i><span></span></div>
        <b>Azul oscuro <i data-icono="check" class="palomita"></i></b>
      </button>
      <button class="tema-card" data-t="negro" type="button">
        <div class="vista negro"><i></i><span></span></div>
        <b>Negro <i data-icono="check" class="palomita"></i></b>
      </button>
    </div>
  </div>

  <div class="pg-card">
    <h3>Menú</h3>
    <div class="opcion-fila">
      <div><b>Menú compacto</b><small>Solo se ven los iconos, igual que con los tres puntitos de arriba.</small></div>
      <label class="switch" aria-label="Menú compacto"><input type="checkbox" id="cfg-menu"><span></span></label>
    </div>
  </div>
</div>
