<div class="pg">
  <form class="pg-card calificar-centro" id="form-opinion">
    <b>¿Qué tan bien te pareció el sistema?</b>
    <div class="estrellas" id="estrellas"></div>
    <p class="sub" id="texto-estrellas">Toca una estrella</p>
    <label>Comentarios (opcional)
      <textarea name="comentario" rows="4" maxlength="300" placeholder="¿Qué te gustó? ¿Qué podemos mejorar?"></textarea>
    </label>
    <p id="msg" hidden></p>
    <button class="btn">Enviar opinión</button>
  </form>
</div>
